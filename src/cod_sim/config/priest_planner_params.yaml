# priest_planner_params.yaml — PRIEST 测试用全局规划参数
# 标准 nav2 结构：global_costmap 是 planner_server 内置子节点（/global_costmap/global_costmap），
# 参数在根级 global_costmap.global_costmap.ros__parameters（与 nav2_bringup 一致）。
# 生命周期顺序：map_server 先激活出图 -> planner_server 再配置（其内置 costmap 静态层需要 /map）

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 25
      height: 25
      resolution: 0.05
      rolling_window: true
      track_unknown_space: true
      # 参考 MPPI（gt_sim_params.yaml）：全局 costmap 只用 static+inflation，
      # 避障由局部控制器（PRIEST）自己用点云做（obs_range），不做 costmap obstacle_layer
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map   # 绝对话题：costmap 在 /global_costmap 命名空间下，相对 'map' 解析不到 /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.75   # 与 MPPI 一致，让全局路径离障碍更远
      always_send_full_costmap: false
